server:
  port: 8082

spring:
  application:
    name: order-service
  profiles:
    active: dev

  # ---------- Nacos 注册中心 / 配置中心 ----------
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        namespace: public
        group: DEFAULT_GROUP
  config:
    import:
      # optional: 前缀表示 Nacos 未启动时本地也能正常启动
      - optional:nacos:order-service.yaml

  # ---------- 数据源（Druid + MySQL） ----------
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mavenium?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # ---------- Redis ----------
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      password: 123

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mavenium.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 接口文档：http://localhost:8082/swagger-ui/index.html ----------
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

# ---------- 监控：http://localhost:8082/actuator/health ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.mavenium: debug
